<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Письма для Леры</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="app.css">
  <style>
    .screen { padding-bottom: calc(var(--bottom) + 40px); }
    .day { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .day header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .day b { font-family: var(--display); }
    .day .saved { font-size: 12px; font-weight: 800; color: #3E9A6B; }
    .day .saved.err { color: #C9534A; }
    .day textarea { width: 100%; min-height: 90px; resize: vertical; border: 2px solid #EADCC8; border-radius: 12px; padding: 10px 12px; background: #FFFDF8; color: var(--paper-ink); font: 600 16px/1.5 var(--body); }
    .day textarea:focus { outline: none; border-color: var(--rose); }
    .day.today { box-shadow: 0 0 0 3px var(--rose); }
    .day.empty textarea { border-style: dashed; }
    .mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 70px; }
    .mini i { display: block; border-radius: 6px; background: var(--accent-soft); min-height: 3px; }
    .mini i.met { background: var(--accent); }
    .mini-l { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 11px; color: var(--muted); font-weight: 800; text-align: center; }
  </style>
</head>
<body>
  <main class="screen" id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="config.js"></script>
  <script>
  (function () {
    const CFG = window.APP_CONFIG || {};
    const $ = s => document.querySelector(s);
    const pad = n => String(n).padStart(2, '0');
    const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateRu = k => new Date(k + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    let key = ''; try { key = localStorage.getItem('glotok-admin') || ''; } catch (e) { }
    let data = null, showPast = false;

    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 3000); }
    async function api(path, opts = {}) {
      const r = await fetch(CFG.API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key } });
      if (r.status === 403) throw new Error('key');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    function login(msg) {
      $('#app').innerHTML = `<h1>Письма для Леры</h1>
        <form class="card" id="login"><div class="field"><label for="k">Ключ администратора</label>
        <input class="input" id="k" type="password" autocomplete="current-password" value="${esc(key)}"></div>
        ${msg ? `<p class="status bad">${msg}</p>` : ''}<button class="btn" type="submit">Войти</button></form>`;
    }

    async function load() {
      if (!CFG.API) { $('#app').innerHTML = '<h1>Письма для Леры</h1><p class="card">Сервер ещё не подключён: заполни config.js.</p>'; return; }
      if (!key) return login();
      try { data = await api('/admin/overview'); render(); }
      catch (e) { login(e.message === 'key' ? 'Ключ не подошёл.' : 'Не удалось связаться с сервером.'); }
    }

    function render() {
      const s = data.state;
      const today = new Date();
      const days = [];
      for (let i = 0; i < 30; i++) { const d = new Date(today); d.setDate(d.getDate() + i); days.push(dkey(d)); }
      const past = Object.keys(data.letters).filter(k => k < dkey(today)).sort().reverse();
      const written = days.filter(k => data.letters[k]).length;
      const lastTxt = s && s.last ? new Date(s.last).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'ещё не пила';
      const max = s ? Math.max(...s.days.map(d => Math.max(d.ml, d.goal))) : 1;
      $('#app').innerHTML = `
        <header class="topbar"><h1>Письма для Леры</h1><button class="btn small soft" id="logout">Выйти</button></header>
        ${s ? `<section class="card">
          <div class="setrow"><span>${esc(s.petName)} <span class="muted">· сегодня</span></span><b class="num">${fmt(s.today)} из ${fmt(s.goal)} мл</b></div>
          <div class="bar ${s.today >= s.goal ? 'done' : ''}"><i style="width:${Math.min(100, s.today / s.goal * 100)}%"></i></div>
          <div class="mini">${s.days.map(d => `<i class="${d.ml >= d.goal ? 'met' : ''}" style="height:${Math.round(d.ml / max * 100)}%" title="${d.date}: ${d.ml} мл"></i>`).join('')}</div>
          <div class="mini-l">${s.days.map(d => `<span>${+d.date.slice(8)}</span>`).join('')}</div>
          <p class="hint">Последний стакан: ${lastTxt}. Уведомления: ${s.notify ? 'включены' : 'не включены'}.</p>
        </section>
        <section class="card"><h2 class="section-title">Попросить попить</h2>
          <input class="input" id="nudge" maxlength="140" placeholder="Лера, тебе передали: попей, пожалуйста, воды!">
          <button class="btn" id="send-nudge" ${s.notify ? '' : 'disabled'}>Отправить уведомление</button>
          <p class="hint">Придёт от имени ${esc(s.petName)}.</p>
        </section>` : `<p class="card">Лера ещё не открывала приложение.</p>`}
        <section class="card"><div class="field"><label for="sig">Подпись под письмами</label>
          <input class="input" id="sig" maxlength="60" placeholder="Например: Твой Котик" value="${esc(data.signature)}"></div></section>
        <h2 class="section-title">Следующие 30 дней · написано ${written}</h2>
        <p class="hint">Письмо откроется в тот день, когда Лера выпьет норму. Текст сохраняется сам, когда уходишь из поля.</p>
        ${days.map((k, i) => dayCard(k, i === 0)).join('')}
        ${past.length ? `<button class="btn ghost" id="toggle-past">${showPast ? 'Скрыть прошлые письма' : 'Показать прошлые письма (' + past.length + ')'}</button>
          ${showPast ? past.map(k => dayCard(k, false)).join('') : ''}` : ''}`;
    }
    function dayCard(k, isToday) {
      const t = data.letters[k] || '';
      return `<div class="day ${isToday ? 'today' : ''} ${t ? '' : 'empty'}"><header><b>${isToday ? 'Сегодня, ' : ''}${dateRu(k)}</b><span class="saved" id="s-${k}"></span></header>
        <textarea id="t-${k}" data-date="${k}" placeholder="Напиши ей что-нибудь тёплое…" aria-label="Письмо на ${dateRu(k)}">${esc(t)}</textarea></div>`;
    }

    document.addEventListener('submit', e => {
      if (e.target.id !== 'login') return;
      e.preventDefault();
      key = $('#k').value.trim();
      try { localStorage.setItem('glotok-admin', key); } catch (err) { }
      load();
    });
    document.addEventListener('change', async e => {
      const el = e.target;
      if (el.dataset.date) {
        const k = el.dataset.date, mark = $('#s-' + k);
        mark.className = 'saved'; mark.textContent = 'Сохраняю…';
        try {
          await api('/admin/letter', { method: 'PUT', body: JSON.stringify({ date: k, text: el.value }) });
          if (el.value.trim()) data.letters[k] = el.value; else delete data.letters[k];
          mark.textContent = el.value.trim() ? 'Сохранено' : 'Удалено';
          el.closest('.day').classList.toggle('empty', !el.value.trim());
        } catch (err) { mark.className = 'saved err'; mark.textContent = 'Не сохранилось, попробуй ещё раз'; }
      }
      if (el.id === 'sig') {
        try { await api('/admin/signature', { method: 'PUT', body: JSON.stringify({ signature: el.value }) }); data.signature = el.value; toast('Подпись сохранена'); }
        catch (err) { toast('Подпись не сохранилась. Проверь интернет.'); }
      }
    });
    document.addEventListener('click', async e => {
      if (e.target.id === 'logout') { key = ''; try { localStorage.removeItem('glotok-admin'); } catch (err) { } login(); }
      if (e.target.id === 'toggle-past') { showPast = !showPast; render(); }
      if (e.target.id === 'send-nudge') {
        try { await api('/admin/nudge', { method: 'POST', body: JSON.stringify({ text: $('#nudge').value }) }); toast('Отправлено'); $('#nudge').value = ''; }
        catch (err) { toast('Не отправилось. Возможно, у Леры выключены уведомления.'); }
      }
    });
    load();
  })();
  </script>
</body>
</html>
