<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Пульт Глотка</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="app.css">
  <style>
    .screen { padding-bottom: calc(var(--bottom) + 40px); max-width: 640px; }
    .adm-tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
    .day { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .day header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .day b { font-family: var(--display); }
    .day .saved { font-size: 12px; font-weight: 800; color: #3E9A6B; }
    .day .saved.err { color: #C9534A; }
    .day textarea { width: 100%; min-height: 90px; resize: vertical; border: 2px solid #EADCC8; border-radius: 12px; padding: 10px 12px; background: #FFFDF8; color: var(--paper-ink); font: 600 16px/1.5 var(--body); }
    .day textarea:focus { outline: none; border-color: var(--rose); }
    .day.today { box-shadow: 0 0 0 3px var(--rose); }
    .day.empty textarea { border-style: dashed; }
    .mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 64px; }
    .mini i { display: block; border-radius: 6px; background: var(--accent-soft); min-height: 3px; }
    .mini i.met { background: var(--accent); }
    .mini.food i { background: var(--food-soft); }
    .mini.food i.met { background: var(--food); }
    .mini-l { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 11px; color: var(--muted); font-weight: 800; text-align: center; }
    .gift-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .gift { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .gift svg { width: 70px; height: 48px; }
    .gift small { color: var(--muted); font-size: 12px; font-weight: 700; }
    .gift.has { box-shadow: var(--shadow), inset 0 0 0 2px var(--rose); }
    .gift .btn { width: 100%; }
    .gift input { font-size: 14px; padding: 8px 10px; }
    .pet-mini { width: 160px; align-self: center; }
    .pet-mini svg { width: 100%; height: auto; }
  </style>
</head>
<body>
  <main class="screen" id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="config.js"></script>
  <script src="pets.js"></script>
  <script>
  (function () {
    const CFG = window.APP_CONFIG || {};
    const { ACCESSORIES, ACC_SVG, drawPet } = window.Pets;
    const ACC_VIEW = {
      bow: '116 28 52 46', scarf: '48 132 104 64', glasses: '54 80 92 40', hat: '36 0 128 82',
      flowers: '44 32 112 46', headphones: '24 26 152 100', crown: '64 14 72 46',
      heart: '120 36 38 34', rose: '118 42 42 34', bowtie: '74 140 52 32', tiara: '60 18 80 46'
    };
    const MEALS = { breakfast: 'Завтрак', lunch: 'Обед', dinner: 'Ужин', snack: 'Перекус' };
    const REPEATS = { none: 'Не повторять', daily: 'Каждый день', weekdays: 'По будням', weekly: 'Каждую неделю' };
    const $ = s => document.querySelector(s);
    const pad = n => String(n).padStart(2, '0');
    const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const dateRu = k => new Date(k + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long' });
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = n => Math.round(n).toLocaleString('ru-RU');
    const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const when = t => new Date(t).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    let key = ''; try { key = localStorage.getItem('glotok-admin') || ''; } catch (e) { }
    let data = null, tab = 'overview', showPast = false, giftOpen = '', draft = null, repeat = 'none';

    function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 3000); }
    async function api(path, opts = {}) {
      const r = await fetch(CFG.API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Admin-Key': key } });
      if (r.status === 403) throw new Error('key');
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      return j;
    }

    function login(msg) {
      $('#app').innerHTML = `<h1>Пульт Глотка</h1>
        <form class="card" id="login"><div class="field"><label for="k">Ключ администратора</label>
        <input class="input" id="k" type="password" autocomplete="current-password" value="${esc(key)}"></div>
        ${msg ? `<p class="status bad">${msg}</p>` : ''}<button class="btn" type="submit">Войти</button></form>`;
    }
    async function load() {
      if (!CFG.API) { $('#app').innerHTML = '<h1>Пульт Глотка</h1><p class="card">Сервер ещё не подключён: заполни config.js.</p>'; return; }
      if (!key) return login();
      try { data = await api('/admin/overview'); render(); }
      catch (e) { login(e.message === 'key' ? 'Ключ не подошёл.' : 'Не удалось связаться с сервером.'); }
    }

    function render() {
      const tabs = [['overview', 'Обзор'], ['tasks', 'Дела'], ['gifts', 'Подарки'], ['settings', 'Настройки'], ['letters', 'Письма']];
      const views = { overview, tasks, gifts, settings, letters };
      $('#app').innerHTML = `
        <header class="topbar"><h1>Пульт Глотка</h1><button class="btn small soft" id="logout">Выйти</button></header>
        <div class="adm-tabs"><div class="seg">${tabs.map(([id, l]) => `<button data-tab="${id}" aria-pressed="${tab === id}">${l}</button>`).join('')}</div></div>
        ${data.state ? views[tab]() : `<p class="card">Лера ещё не открывала приложение. Здесь появятся данные, когда она пройдёт знакомство.</p>${tab === 'letters' ? letters() : ''}`}`;
    }

    function bars(list, f, goalF, cls) {
      const max = Math.max(1, ...list.map(d => Math.max(d[f], d[goalF] || 0)));
      return `<div class="mini ${cls}">${list.map(d => `<i class="${d[f] >= (d[goalF] || Infinity) ? 'met' : ''}" style="height:${Math.round(d[f] / max * 100)}%" title="${d.date}: ${fmt(d[f])}"></i>`).join('')}</div>
        <div class="mini-l">${list.map(d => `<span>${+d.date.slice(8)}</span>`).join('')}</div>`;
    }
    function overview() {
      const s = data.state;
      const kc = s.food.reduce((a, x) => a + x.kcal, 0);
      const days = s.days.map(d => ({ ...d, kgoal: s.kcalGoal }));
      const open = s.tasks.filter(t => !t.done), late = open.filter(t => t.due && t.due < Date.now());
      return `
        <section class="card"><h2 class="section-title">Вода</h2>
          <div class="setrow"><span>${esc(s.petName)} <span class="muted">· сегодня</span></span><b class="num">${fmt(s.today)} из ${fmt(s.goal)} мл</b></div>
          <div class="bar ${s.today >= s.goal ? 'done' : ''}"><i style="width:${Math.min(100, s.today / s.goal * 100)}%"></i></div>
          ${bars(s.days, 'ml', 'goal', '')}
          <p class="hint">Последний стакан: ${s.last ? when(s.last) : 'ещё не пила'}. Уведомления: ${s.notify ? 'включены' : 'не включены'}.</p></section>
        <section class="card"><h2 class="section-title">Еда</h2>
          <div class="setrow"><span>Сегодня</span><b class="num">${fmt(kc)} из ${fmt(s.kcalGoal)} ккал</b></div>
          <div class="bar food"><i style="width:${Math.min(100, kc / s.kcalGoal * 100)}%"></i></div>
          <div class="meals">${['breakfast', 'lunch', 'dinner', 'snack'].map(m => { const k = s.food.filter(x => x.meal === m).reduce((a, x) => a + x.kcal, 0); return `<span class="meal ${k ? 'on' : ''}">${MEALS[m]}${k ? ' · ' + fmt(k) : ''}</span>`; }).join('')}</div>
          ${s.food.length ? `<ul class="log">${s.food.map(x => `<li><span><b>${esc(x.name)}</b> <span class="muted">${x.g ? x.g + ' г · ' : ''}${fmt(x.kcal)} ккал</span></span><span class="muted num">${hm(x.t)}</span></li>`).join('')}</ul>` : '<p class="hint">Сегодня ещё ничего не отмечено.</p>'}
          <p class="label">Калории за неделю</p>${bars(days, 'kcal', 'kgoal', 'food')}</section>
        <section class="card"><h2 class="section-title">Дела</h2>
          <p>${open.length} открыто${late.length ? `, <b style="color:var(--bad)">${late.length} просрочено</b>` : ''}. Выполнено за всё время: ${s.tasks.filter(t => t.done).length}.</p>
          <button class="btn soft small" data-tab="tasks">Открыть дела</button></section>
        <section class="card"><h2 class="section-title">Попросить попить</h2>
          <input class="input" id="nudge" maxlength="140" placeholder="Лера, тебе передали: попей, пожалуйста, воды!">
          <button class="btn" id="send-nudge" ${s.notify ? '' : 'disabled'}>Отправить уведомление</button>
          <p class="hint">Придёт от имени ${esc(s.petName)}.</p></section>`;
    }

    function taskLine(t) {
      const late = !t.done && t.due && t.due < Date.now();
      return `<li class="task ${t.done ? 'done' : ''}"><span class="check" aria-hidden="true" ${t.done ? 'aria-pressed="true"' : ''} style="${t.done ? 'background:var(--accent)' : ''}"></span>
        <span class="task-body"><span class="tt">${esc(t.title)}</span><span class="meta">${t.due ? `<span class="${late ? 'late' : ''}">${when(t.due)}</span>` : ''}${t.repeat && t.repeat !== 'none' ? `<span>${REPEATS[t.repeat].toLowerCase()}</span>` : ''}${t.from === 'admin' ? '<span class="from">от тебя</span>' : ''}${t.note ? `<span>${esc(t.note)}</span>` : ''}</span></span>
        ${t.from === 'admin' && !t.done ? `<button class="btn small soft" data-deltask="${t.id}">Удалить</button>` : ''}</li>`;
    }
    function tasks() {
      const list = data.state.tasks;
      const open = list.filter(t => !t.done).sort((a, b) => (a.due || 9e15) - (b.due || 9e15));
      const done = list.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 10);
      const d = draft || { title: '', note: '', due: '' };
      return `
        <form class="card" id="task-form"><h2 class="section-title">Поставить Лере дело</h2>
          <div class="field"><label for="t-title">Что сделать</label><input class="input" id="t-title" maxlength="120" required value="${esc(d.title)}" placeholder="Например, выпить витамины"></div>
          <div class="field"><label for="t-note">Заметка</label><input class="input" id="t-note" maxlength="300" value="${esc(d.note)}"></div>
          <div class="field"><label for="t-due">Когда напомнить</label><input class="input" id="t-due" type="datetime-local" value="${esc(d.due)}"></div>
          <div class="field"><span class="label">Повтор</span><div class="seg">${Object.keys(REPEATS).map(r => `<button type="button" data-repeat="${r}" aria-pressed="${repeat === r}">${REPEATS[r]}</button>`).join('')}</div></div>
          <p class="hint">В её списке дело будет помечено сердечком и подписью «${esc(data.signature || 'от любимого')}». Время указывается по часам твоего устройства.</p>
          <button class="btn" type="submit">Добавить дело</button></form>
        <section class="tgroup"><p class="label">Открытые · ${open.length}</p>${open.length ? `<ul class="tasks">${open.map(taskLine).join('')}</ul>` : '<p class="hint">Открытых дел нет.</p>'}</section>
        ${done.length ? `<section class="tgroup"><p class="label">Недавно выполненные</p><ul class="tasks">${done.map(taskLine).join('')}</ul></section>` : ''}`;
    }

    function gifts() {
      const s = data.state;
      return `
        <section class="card" style="align-items:center"><div class="pet-mini">${drawPet(s.pet || 'otter', 'happy', { wear: s.wear })}</div>
          <p class="hint">Так ${esc(s.petName)} выглядит сейчас. Дней с нормой воды: ${s.goalDays}.</p></section>
        <p class="hint">Подарок сразу открывается у Леры, ей приходит уведомление, а в приложении появляется открытка с твоей запиской. Последние четыре вещи бывают только в подарок.</p>
        <section class="gift-grid">${ACCESSORIES.map(a => {
          const gifted = data.gifts.some(g => g.id === a.id), earned = a.days && s.goalDays >= a.days;
          const status = gifted ? 'подарено' : earned ? 'уже открыто' : a.gift ? 'только подарок' : `откроется за ${a.days} дн.`;
          return `<div class="gift ${gifted ? 'has' : ''}"><svg viewBox="${ACC_VIEW[a.id]}" aria-hidden="true">${ACC_SVG[a.id]}</svg><b>${a.name}</b><small>${status}</small>
            ${gifted ? `<button class="btn small ghost" data-ungift="${a.id}">Забрать</button>`
              : giftOpen === a.id ? `<input class="input" id="gift-note" maxlength="300" placeholder="Записка (необязательно)"><button class="btn small" data-gift="${a.id}">Подарить</button>`
              : `<button class="btn small soft" data-giftopen="${a.id}">Подарить</button>`}</div>`;
        }).join('')}</section>`;
    }

    function settings() {
      const st = data.state.settings;
      const hours = []; for (let h = 8; h <= 22; h++) hours.push(h);
      return `
        <form class="card" id="settings-form"><h2 class="section-title">Вода</h2>
          <div class="row2"><div class="field"><label for="s-goal">Норма, мл</label><input class="input num" id="s-goal" type="number" min="800" max="5000" step="50" value="${st.goal}"></div>
            <div class="field"><label for="s-interval">Грустит без воды через, мин</label><input class="input num" id="s-interval" type="number" min="30" max="300" step="15" value="${st.interval || 90}"></div></div>
          <div class="field"><span class="label">Напоминать о воде в</span><div class="hours">${hours.map(h => `<button type="button" data-hour="${h}" aria-pressed="${st.waterHours.includes(h)}">${h}:00</button>`).join('')}</div>
            <p class="hint">Уведомление приходит, только если она отстаёт от нормы к этому часу.</p></div>
          <h2 class="section-title">Еда</h2>
          <div class="field"><label for="s-kcal">Норма, ккал</label><input class="input num" id="s-kcal" type="number" min="1000" max="4500" step="50" value="${st.kcalGoal}"></div>
          <div class="setrow"><span>Напоминать поесть</span><div class="seg tight"><button type="button" data-meals="1" aria-pressed="${st.mealsOn}">Да</button><button type="button" data-meals="0" aria-pressed="${!st.mealsOn}">Нет</button></div></div>
          <div class="row3">${['breakfast', 'lunch', 'dinner'].map(m => `<div class="field"><label for="s-${m}">${MEALS[m]}</label><input class="input" id="s-${m}" type="time" value="${st.meals[m]}"></div>`).join('')}</div>
          <h2 class="section-title">Сон</h2>
          <div class="row2"><div class="field"><label for="s-sleep">Ложится</label><input class="input" id="s-sleep" type="time" value="${st.sleepStart}"></div>
            <div class="field"><label for="s-wake">Встаёт</label><input class="input" id="s-wake" type="time" value="${st.sleepEnd}"></div></div>
          <p class="hint">Изменения применятся у Леры, когда она в следующий раз откроет приложение. Напоминания с сервера меняются сразу.</p>
          <button class="btn" type="submit">Сохранить</button></form>`;
    }

    function letters() {
      const today = new Date(), days = [];
      for (let i = 0; i < 30; i++) { const d = new Date(today); d.setDate(d.getDate() + i); days.push(dkey(d)); }
      const past = Object.keys(data.letters).filter(k => k < dkey(today)).sort().reverse();
      const written = days.filter(k => data.letters[k]).length;
      return `
        <section class="card"><div class="field"><label for="sig">Подпись под письмами и подарками</label>
          <input class="input" id="sig" maxlength="60" placeholder="Например: Твой Котик" value="${esc(data.signature)}"></div></section>
        <h2 class="section-title">Следующие 30 дней · написано ${written}</h2>
        <p class="hint">Письмо откроется в тот день, когда Лера выпьет норму воды. Текст сохраняется сам, когда уходишь из поля.</p>
        ${days.map((k, i) => dayCard(k, i === 0)).join('')}
        ${past.length ? `<button class="btn ghost" id="toggle-past">${showPast ? 'Скрыть прошлые письма' : 'Показать прошлые письма (' + past.length + ')'}</button>
          ${showPast ? past.map(k => dayCard(k, false)).join('') : ''}` : ''}`;
    }
    function dayCard(k, isToday) {
      const t = data.letters[k] || '';
      return `<div class="day ${isToday ? 'today' : ''} ${t ? '' : 'empty'}"><header><b>${isToday ? 'Сегодня, ' : ''}${dateRu(k)}</b><span class="saved" id="s-${k}"></span></header>
        <textarea id="t-${k}" data-date="${k}" placeholder="Напиши ей что-нибудь тёплое…" aria-label="Письмо на ${dateRu(k)}">${esc(t)}</textarea></div>`;
    }

    const readDraft = () => ({ title: $('#t-title').value, note: $('#t-note').value, due: $('#t-due').value });
    document.addEventListener('submit', async e => {
      e.preventDefault();
      if (e.target.id === 'login') {
        key = $('#k').value.trim();
        try { localStorage.setItem('glotok-admin', key); } catch (err) { }
        return load();
      }
      if (e.target.id === 'task-form') {
        const d = readDraft();
        const due = d.due ? new Date(d.due).getTime() : null;
        if (repeat !== 'none' && !due) { toast('Для повтора нужно время напоминания.'); return; }
        const task = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), title: d.title.trim(), note: d.note.trim(), due, repeat, from: 'admin' };
        try { const r = await api('/admin/task', { method: 'PUT', body: JSON.stringify({ task }) }); data.state = r.state; draft = null; repeat = 'none'; render(); toast('Дело добавлено'); }
        catch (err) { toast('Не получилось: ' + err.message); }
      }
      if (e.target.id === 'settings-form') {
        const st = data.state.settings;
        const settings = {
          goal: +$('#s-goal').value, goalAuto: false, interval: +$('#s-interval').value, waterHours: st.waterHours,
          kcalGoal: +$('#s-kcal').value, kcalAuto: false, mealsOn: st.mealsOn,
          meals: { breakfast: $('#s-breakfast').value, lunch: $('#s-lunch').value, dinner: $('#s-dinner').value },
          sleepStart: $('#s-sleep').value, sleepEnd: $('#s-wake').value
        };
        try { const r = await api('/admin/settings', { method: 'PUT', body: JSON.stringify({ settings }) }); data.state = r.state; render(); toast('Сохранено'); }
        catch (err) { toast('Не сохранилось: ' + err.message); }
      }
    });
    document.addEventListener('change', async e => {
      const el = e.target;
      if (el.dataset.date) {
        const k = el.dataset.date, mark = $('#s-' + k);
        mark.className = 'saved'; mark.textContent = 'Сохраняю…';
        try {
          await api('/admin/letter', { method: 'PUT', body: JSON.stringify({ date: k, text: el.value }) });
          if (el.value.trim()) data.letters[k] = el.value; else delete data.letters[k];
          mark.textContent = el.value.trim() ? 'Сохранено' : 'Удалено';
          el.closest('.day').classList.toggle('empty', !el.value.trim());
        } catch (err) { mark.className = 'saved err'; mark.textContent = 'Не сохранилось, попробуй ещё раз'; }
      }
      if (el.id === 'sig') {
        try { await api('/admin/signature', { method: 'PUT', body: JSON.stringify({ signature: el.value }) }); data.signature = el.value; toast('Подпись сохранена'); }
        catch (err) { toast('Подпись не сохранилась. Проверь интернет.'); }
      }
    });
    document.addEventListener('click', async e => {
      const b = e.target.closest('button');
      if (!b) return;
      const ds = b.dataset;
      if (b.id === 'logout') { key = ''; try { localStorage.removeItem('glotok-admin'); } catch (err) { } login(); return; }
      if (ds.tab) { if (tab === 'tasks' && $('#t-title')) draft = readDraft(); tab = ds.tab; render(); window.scrollTo(0, 0); return; }
      if (b.id === 'toggle-past') { showPast = !showPast; render(); return; }
      if (b.id === 'send-nudge') {
        try { await api('/admin/nudge', { method: 'POST', body: JSON.stringify({ text: $('#nudge').value }) }); toast('Отправлено'); $('#nudge').value = ''; }
        catch (err) { toast('Не отправилось. Возможно, у Леры выключены уведомления.'); }
        return;
      }
      if (ds.repeat) { draft = readDraft(); repeat = ds.repeat; render(); return; }
      if (ds.deltask) {
        try { const r = await api('/admin/task', { method: 'PUT', body: JSON.stringify({ task: { id: ds.deltask, deleted: true } }) }); data.state = r.state; render(); toast('Дело удалено'); }
        catch (err) { toast('Не получилось: ' + err.message); }
        return;
      }
      if (ds.giftopen) { giftOpen = ds.giftopen; render(); setTimeout(() => $('#gift-note')?.focus(), 30); return; }
      if (ds.gift || ds.ungift) {
        const body = ds.gift ? { id: ds.gift, note: $('#gift-note')?.value || '' } : { id: ds.ungift, remove: true };
        try { const r = await api('/admin/gift', { method: 'POST', body: JSON.stringify(body) }); data.gifts = r.gifts; giftOpen = ''; render(); toast(ds.gift ? 'Подарено! Лере пришло уведомление.' : 'Подарок забран'); }
        catch (err) { toast('Не получилось: ' + err.message); }
        return;
      }
      if (ds.hour) {
        const h = +ds.hour, st = data.state.settings;
        st.waterHours = st.waterHours.includes(h) ? st.waterHours.filter(x => x !== h) : [...st.waterHours, h].sort((a, c) => a - c);
        b.setAttribute('aria-pressed', st.waterHours.includes(h)); return;
      }
      if (ds.meals) {
        data.state.settings.mealsOn = ds.meals === '1';
        document.querySelectorAll('[data-meals]').forEach(x => x.setAttribute('aria-pressed', x.dataset.meals === ds.meals)); return;
      }
    });
    load();
  })();
  </script>
</body>
</html>
